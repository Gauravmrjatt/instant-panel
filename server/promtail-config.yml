server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /run/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: instant-panel
    static_configs:
      - targets:
          - localhost
        labels:
          job: instant-panel
          service: instant-panel
          __path__: /var/log/instant-panel/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            time: time
            pid: pid
            err: err
      - labels:
          level:
          pid:
